<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#005b86">
    <title>Areterra — Offline</title>
    <style>
        *{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(circle at 90% 5%,rgba(0,157,230,.16),transparent 35%),#f3f8fb;color:#173f59;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,440px);padding:28px;border:1px solid #d3e5ee;border-radius:22px;background:#fff;box-shadow:0 24px 70px -45px #003f60}.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:#fff4c5;color:#705200;font-size:25px}.eyebrow{margin-top:22px;color:#087fb9;font-size:10px;font-weight:900;letter-spacing:.14em}.card h1{margin:7px 0 10px;font-size:30px;letter-spacing:-.04em}.card p{margin:0;color:#647f90;line-height:1.6}.card button{width:100%;min-height:50px;margin-top:24px;border:0;border-radius:12px;background:#e8b818;color:#073852;font-weight:850}.note{margin-top:15px!important;font-size:11px}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#d79619}
    </style>
</head>
<body><main class="card"><div class="mark">A</div><div class="eyebrow">ARETERRA HUB</div><h1>No connection just now</h1><p>The Hub keeps confidential records off the offline cache. Any daily-story draft already open in this tab will remain on this device.</p><button onclick="location.reload()">Try again</button><p class="note"><span class="dot"></span>Reconnect to open another record or submit changes.</p></main></body>
</html>
